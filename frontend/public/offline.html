<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E1D1F">
<title>Servd · Offline</title>
<style>
  html,body{margin:0;height:100%}
  body{background:#1E1D1F;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:22px 22px;font-family:Urbanist,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#121212;display:grid;place-items:center;padding:16px;box-sizing:border-box}
  .card{max-width:420px;width:100%;background:#F7F7F8;border-radius:30px;padding:36px 28px;text-align:center;box-shadow:0 50px 120px -30px rgba(0,0,0,.7)}
  .logo{color:#E11D24;font-weight:800;font-size:27px;letter-spacing:-.04em}
  h1{font-size:30px;letter-spacing:-.03em;margin:18px 0 8px}
  p{color:#3A3A40;font-size:17px;line-height:1.5;margin:0 0 22px}
  button{height:56px;padding:0 28px;border:0;border-radius:999px;background:#121212;color:#fff;font:inherit;font-size:17px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SERVD</div>
    <h1>You're offline</h1>
    <p>Servd needs a connection for recipes and your pantry. Pages you've opened before will still load.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
